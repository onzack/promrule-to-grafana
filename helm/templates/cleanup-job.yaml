{{- if .Values.cleanup.enabled }}
{{- $includeNs := ".*" -}}
{{- if .Values.rules.namespaces -}}
{{- $includeNs = printf "^(%s)$" (join "|" .Values.rules.namespaces) -}}
{{- end -}}
{{- $excludeNs := "^$" -}}
{{- if .Values.rules.excludeNamespaces -}}
{{- $excludeNs = printf "^(%s)$" (join "|" .Values.rules.excludeNamespaces) -}}
{{- end -}}
{{- $timeout := include "promrule-to-grafana.toSeconds" .Values.cleanup.timeout | int -}}
{{- $scaleWait := add (.Values.terminationGracePeriodSeconds | int) 30 -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-cleanup" (include "promrule-to-grafana.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "promrule-to-grafana.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup
  annotations:
    {{- include "promrule-to-grafana.hookAnnotations" . | nindent 4 }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ $timeout }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "promrule-to-grafana.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cleanup
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with (merge (dict) .Values.podAnnotations .Values.commonAnnotations) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "promrule-to-grafana.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: download-tools
          image: {{ include "promrule-to-grafana.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /scripts/download-tools.sh
          env:
            - name: HOME
              value: /tmp
            - name: TOOLS_DIR
              value: /tools
            - name: DEBUG
              value: {{ .Values.sync.debug | quote }}
            - name: FORCE_DOWNLOAD
              value: {{ .Values.tools.forceDownload | quote }}
            - name: MIMIRTOOL_VERSION
              value: {{ .Values.tools.mimirtool.version | quote }}
            - name: MIMIRTOOL_URL
              value: {{ .Values.tools.mimirtool.url | quote }}
            - name: KUBECTL_VERSION
              value: {{ .Values.tools.kubectl.version | quote }}
            - name: KUBECTL_URL
              value: {{ .Values.tools.kubectl.url | quote }}
            - name: YQ_VERSION
              value: {{ .Values.tools.yq.version | quote }}
            - name: YQ_URL
              value: {{ .Values.tools.yq.url | quote }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.initResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tools
              mountPath: /tools
            - name: tmp
              mountPath: /tmp
      containers:
        - name: cleanup
          image: {{ include "promrule-to-grafana.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /scripts/cleanup.sh
          workingDir: /tmp
          env:
            - name: HOME
              value: /tmp
            - name: TOOLS_DIR
              value: /tools
            - name: STATE_DIR
              value: /tmp/state
            - name: DEBUG
              value: {{ .Values.sync.debug | quote }}
            - name: DEPLOYMENT_NAME
              value: {{ include "promrule-to-grafana.fullname" . | quote }}
            - name: SCALE_WAIT_SECONDS
              value: {{ $scaleWait | quote }}
            - name: MIMIRTOOL_EXTRA_ARGS
              value: {{ join " " .Values.sync.extraArgs | quote }}
            - name: RULE_LABEL_SELECTOR
              value: {{ .Values.rules.labelSelector | quote }}
            - name: INCLUDE_NAMESPACES_REGEX
              value: {{ $includeNs | quote }}
            - name: EXCLUDE_NAMESPACES_REGEX
              value: {{ $excludeNs | quote }}
            - name: IGNORE_ANNOTATION
              value: {{ .Values.rules.ignoreAnnotation | quote }}
            - name: RULES_FOLDER
              value: {{ .Values.rules.folder | quote }}
            - name: CLEANUP_EXTRA_NAMESPACES
              value: {{ join "\n" .Values.cleanup.extraNamespaces | quote }}
            - name: MIMIR_ADDRESS
              value: {{ include "promrule-to-grafana.mimirAddress" . | quote }}
            - name: MIMIR_TENANT_ID
              value: {{ .Values.grafana.tenantId | quote }}
            - name: MIMIR_EXTRA_HEADERS
              value: {{ include "promrule-to-grafana.extraHeaders" . | quote }}
            - name: MIMIR_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "promrule-to-grafana.authSecretName" . }}
                  key: {{ include "promrule-to-grafana.authSecretKey" . }}
            - name: GRAFANA_TLS_SKIP_VERIFY
              value: {{ .Values.grafana.tls.insecureSkipVerify | quote }}
            {{- if .Values.grafana.tls.caSecret }}
            - name: GRAFANA_TLS_CA_PATH
              value: /etc/grafana-ca/{{ .Values.grafana.tls.caSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.grafana.tls.caSecret }}
            - name: grafana-ca
              mountPath: /etc/grafana-ca
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "promrule-to-grafana.fullname" . }}-scripts
            defaultMode: 0555
        - name: tools
          emptyDir:
            {{- with .Values.volumeSizeLimits.tools }}
            sizeLimit: {{ . }}
            {{- end }}
        - name: tmp
          emptyDir:
            {{- with .Values.volumeSizeLimits.tmp }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- if .Values.grafana.tls.caSecret }}
        - name: grafana-ca
          secret:
            secretName: {{ .Values.grafana.tls.caSecret }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
