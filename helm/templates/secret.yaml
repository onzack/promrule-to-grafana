{{- if and .Values.grafana.auth.token (not .Values.grafana.auth.existingSecret) }}
{{/*
Debugging convenience only. The token ends up in the Helm release secret and in
whatever values file it came from. Use grafana.auth.existingSecret in production,
for example pointing at a Secret produced by an ExternalSecret in extraManifests.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "promrule-to-grafanarule-converter.authSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "promrule-to-grafanarule-converter.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  token: {{ .Values.grafana.auth.token | quote }}
{{- end }}
