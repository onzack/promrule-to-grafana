{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "promrule-to-grafana.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "promrule-to-grafana.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.serviceAccount.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
