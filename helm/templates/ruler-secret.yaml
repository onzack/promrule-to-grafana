{{- if and .Values.recordingRules.enabled (not .Values.recordingRules.existingSecret) }}
{{/*
A Secret rather than a ConfigMap: recordingRules.query.httpConfig and
recordingRules.remoteWrite.extraConfig may carry credentials.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "promrule-to-grafana.fullname" . }}-ruler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "promrule-to-grafana.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  query.yaml: |
    {{- include "promrule-to-grafana.rulerQueryConfig" . | nindent 4 }}
  remote-write.yaml: |
    {{- include "promrule-to-grafana.rulerRemoteWriteConfig" . | nindent 4 }}
{{- end }}
