# Production-shaped values: the token comes from a Secret produced by an
# ExternalSecret that ships with the release.
grafana:
  url: https://grafana.example.com
  datasourceUID: PBFA97CFB590B2093
  auth:
    existingSecret: grafana-rule-sync-token
    existingSecretKey: token
  tls:
    caSecret: grafana-ca
    caSecretKey: ca.crt

rules:
  excludeNamespaces:
    - kube-system
    - kube-public
  labelSelector: release=kube-prometheus-stack
  # Exercises the opt-out path: one folder per PrometheusRule, so the group name
  # does not need an origin prefix.
  folder: ""
  namespaceExpr: '$m.namespace + "-" + $m.name'
  groupNameExpr: '.name'

sync:
  interval: 30s
  fullSyncInterval: 10m

tools:
  mimirtool:
    version: "3.2.1"

extraManifests:
  # Map form: template expressions have to be quoted strings, because the values
  # file itself is parsed as plain YAML before `tpl` ever sees it.
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: '{{ include "promrule-to-grafana.fullname" . }}-grafana-token'
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: grafana-rule-sync-token
        creationPolicy: Owner
      data:
        - secretKey: token
          remoteRef:
            key: monitoring/grafana
            property: rule-sync-token

  # String form: the whole manifest is a template, so block helpers such as
  # nindent work as they do inside the chart's own templates.
  - |
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: {{ include "promrule-to-grafana.fullname" . }}
      labels:
        {{- include "promrule-to-grafana.labels" . | nindent 4 }}
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          {{- include "promrule-to-grafana.selectorLabels" . | nindent 6 }}
