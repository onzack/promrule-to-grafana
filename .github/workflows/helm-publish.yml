name: Publish Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'helm/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_NAME: promrule-to-grafana
  CHART_PATH: helm

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin

      - name: Update Helm dependencies
        run: |
          helm dependency update ${{ env.CHART_PATH }}

      - name: Package and push Helm chart
        run: |
          # Package the chart
          helm package ${{ env.CHART_PATH }}

          # Get the chart version from Chart.yaml
          CHART_VERSION=$(grep '^version:' ${{ env.CHART_PATH }}/Chart.yaml | cut -d' ' -f2)

          # Push to GHCR
          helm push ${{ env.CHART_NAME }}-$CHART_VERSION.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm-charts
